name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, lint, and publish draft release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chromium extension
        run: npm run prod

      - name: Build Firefox extension
        run: npm run prodFf

      - name: Build Firefox source bundle (AMO submission)
        run: npm run prodFff

      - name: Verify artifacts exist
        run: |
          set -euo pipefail
          for artifact in \
            build/global-speed-chromium.zip \
            buildFf/global-speed-firefox.zip \
            buildFf/source.zip; do
            if [ ! -f "$artifact" ]; then
              echo "::error::Missing artifact: $artifact"
              exit 1
            fi
            if [ ! -s "$artifact" ]; then
              echo "::error::Artifact is empty: $artifact"
              exit 1
            fi
          done
          echo "All release artifacts present:"
          ls -l build/global-speed-chromium.zip buildFf/global-speed-firefox.zip buildFf/source.zip

      - name: Lint Firefox extension (web-ext gate)
        run: |
          set -euo pipefail
          npx_exit=0
          npx --yes web-ext@latest lint --source-dir buildFf/unpacked --output json > webext-lint-report.json || npx_exit=$?
          if [ ! -s webext-lint-report.json ]; then
            echo "::error::web-ext lint produced no report (exit code ${npx_exit})."
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            let report;
            try {
              report = JSON.parse(fs.readFileSync("webext-lint-report.json", "utf8"));
            } catch {
              console.error("::error::Could not parse web-ext lint report.");
              process.exit(1);
            }
            const errors = report.errors ?? [];
            const warnings = report.warnings ?? [];
            const text = (m) => `${m.message}${m.description ? ": " + m.description : ""}`.replace(/\s+/g, " ").trim();
            const loc = (m) => `${m.file ? " (" + m.file + (m.line ? ":" + m.line : "") + ")" : ""}`;
            console.log(`web-ext lint summary: ${errors.length} error(s), ${warnings.length} warning(s)`);
            for (const m of warnings.slice(0, 10)) {
              console.log(`::warning::${text(m)}${loc(m)}`);
            }
            for (const m of errors.slice(0, 20)) {
              console.log(`::error::${text(m)}${loc(m)}`);
            }
            if (errors.length > 0) {
              console.error(`::error::web-ext lint gate failed with ${errors.length} error(s); refusing to create a release.`);
              process.exit(1);
            }
          '
          if [ "${npx_exit}" -ne 0 ]; then
            echo "::error::web-ext lint exited with status ${npx_exit} despite reporting no errors."
            exit 1
          fi
          echo "web-ext lint gate passed."

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts=(
            build/global-speed-chromium.zip
            buildFf/global-speed-firefox.zip
            buildFf/source.zip
          )
          version=$(node -p "require('./staticCh/manifest.json').version")
          expected_tag="v${version}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Dry run (workflow_dispatch): would create DRAFT release '${expected_tag}' titled 'Global Speed ${expected_tag}' with:"
            ls -l "${artifacts[@]}"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          if [ "${tag}" != "${expected_tag}" ]; then
            echo "::warning::Tag '${tag}' does not match manifest version '${expected_tag}'; releasing under tag '${tag}'."
          fi
          gh release create "${tag}" "${artifacts[@]}" \
            --draft \
            --title "Global Speed ${tag}" \
            --generate-notes
